<section class="auth-page">
  <article class="auth-card">
    <div class="auth-header">
      <p class="eyebrow">Acceso al jugador</p>

      <h2>Iniciar sesión</h2>

      <p>
        Ingresá con tu correo y contraseña para acceder a la Sala Argentina de Juegos.
      </p>
    </div>

    <form class="auth-form" (ngSubmit)="login()" novalidate>
      <label>
        Correo electrónico
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tu-email@ejemplo.com"
          autocomplete="email"
          [disabled]="loading()"
        />
      </label>

      <label>
        Contraseña
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresá tu contraseña"
          autocomplete="current-password"
          [disabled]="loading()"
        />
      </label>

      @if (error()) {
        <div class="message error">
          {{ error() }}
        </div>
      }

      <button class="btn primary" type="submit" [disabled]="loading()">
        @if (loading()) {
          Ingresando...
        } @else {
          Iniciar sesión
        }
      </button>
    </form>

    <div class="quick-access">
      <p>Inicio rápido para pruebas</p>

      <div class="quick-buttons">
        @for (user of quickAccessUsers; track user.email) {
          <button
            type="button"
            class="btn quick"
            [disabled]="loading()"
            (click)="quickLogin(user)"
          >
            {{ user.label }}
          </button>
        }
      </div>
    </div>

    <p class="auth-footer">
      ¿Todavía no tenés cuenta?
      <a routerLink="/register">Registrate acá</a>
    </p>
  </article>
</section>
