<section class="page-card">
  <h2>Iniciar sesión</h2>
  <p class="intro">
    Esta pantalla por ahora es solo la base. En el Sprint 2 se va a conectar
    con Supabase para validar el usuario de verdad.
  </p>

  <form class="form-layout">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="Ingresá tu correo" />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Ingresá tu contraseña" />
    </div>

    <button type="button">Ingresar</button>
  </form>

  <p class="note">
    Si no tenés cuenta todavía,
    <a routerLink="/register">registrate</a>.
  </p>
</section>
