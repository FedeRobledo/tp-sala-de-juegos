<section class="auth-page">
  <article class="auth-card">
    <div class="auth-header">
      <p class="eyebrow">Nuevo jugador</p>

      <h2>Crear cuenta</h2>

      <p>
        Registrate para ingresar a la Sala Argentina de Juegos y guardar tu progreso.
      </p>
    </div>

    <form class="auth-form" (ngSubmit)="register()" novalidate>
      <div class="form-row">
        <label>
          Nombre
          <input
            type="text"
            name="nombre"
            [(ngModel)]="nombre"
            placeholder="Federico"
            autocomplete="given-name"
            [disabled]="loading()"
          />
        </label>

        <label>
          Apellido
          <input
            type="text"
            name="apellido"
            [(ngModel)]="apellido"
            placeholder="Robledo"
            autocomplete="family-name"
            [disabled]="loading()"
          />
        </label>
      </div>

      <label>
        Edad
        <input
          type="number"
          name="edad"
          [(ngModel)]="edad"
          placeholder="25"
          min="1"
          max="100"
          [disabled]="loading()"
        />
      </label>

      <label>
        Correo electrónico
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tu-email@ejemplo.com"
          autocomplete="email"
          [disabled]="loading()"
        />
      </label>

      <label>
        Contraseña
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
          [disabled]="loading()"
        />
      </label>

      @if (error()) {
        <div class="message error">
          {{ error() }}
        </div>
      }

      <button class="btn primary" type="submit" [disabled]="loading()">
        @if (loading()) {
          Creando cuenta...
        } @else {
          Registrarme
        }
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tenés cuenta?
      <a routerLink="/login">Iniciá sesión</a>
    </p>
  </article>
</section>
