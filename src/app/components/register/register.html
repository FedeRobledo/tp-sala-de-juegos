<section class="page-card">
  <h2>Registro de usuario</h2>
  <p class="intro">
    Esta parte por ahora también está de forma base. En el Sprint 2 se va a agregar
    el alta real de usuarios y el guardado de datos.
  </p>

  <form class="form-layout">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" placeholder="Ingresá tu nombre" />
    </div>

    <div class="form-group">
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" placeholder="Ingresá tu apellido" />
    </div>

    <div class="form-group">
      <label for="edad">Edad</label>
      <input id="edad" type="number" placeholder="Ingresá tu edad" />
    </div>

    <div class="form-group">
      <label for="correo">Correo electrónico</label>
      <input id="correo" type="email" placeholder="Ingresá tu correo" />
    </div>

    <div class="form-group">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" placeholder="Ingresá tu contraseña" />
    </div>

    <button type="button">Registrarse</button>
  </form>

  <p class="note">
    Si ya tenés una cuenta,
    <a routerLink="/login">podés ir al login</a>.
  </p>
</section>
